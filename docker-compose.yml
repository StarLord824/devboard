version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devboard
    ports:
      - "5432:5432"
    volumes:
      - devboard_pgdata:/var/lib/postgresql/data

volumes:
  devboard_pgdata:
